[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-tracker-pipeline"
version = "0.1.0"
description = "Deterministic market-data pipeline for the US market daily report"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.1", "PyYAML>=6.0.2", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[project.scripts]
market-tracker = "market_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
