name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - reports
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Import published reports when available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/src/data/reports site/public/data/reports site/src/data/knowledge site/public/data/knowledge

          if git ls-remote --exit-code --heads origin reports >/dev/null 2>&1; then
            git fetch --quiet --depth=1 origin reports
            mkdir -p "${RUNNER_TEMP}/reports-branch"
            git archive FETCH_HEAD | tar -x -C "${RUNNER_TEMP}/reports-branch"

            if [[ -d "${RUNNER_TEMP}/reports-branch/reports" ]]; then
              cp -R "${RUNNER_TEMP}/reports-branch/reports/." site/src/data/reports/
              cp -R "${RUNNER_TEMP}/reports-branch/reports/." site/public/data/reports/
            fi

            if [[ -f "${RUNNER_TEMP}/reports-branch/index.json" ]]; then
              cp "${RUNNER_TEMP}/reports-branch/index.json" site/src/data/reports/index.json
              cp "${RUNNER_TEMP}/reports-branch/index.json" site/public/data/reports/index.json
            fi

            if [[ -d "${RUNNER_TEMP}/reports-branch/knowledge" ]]; then
              cp -R "${RUNNER_TEMP}/reports-branch/knowledge/." site/src/data/knowledge/
              cp -R "${RUNNER_TEMP}/reports-branch/knowledge/." site/public/data/knowledge/
            fi
          else
            echo 'The reports branch does not exist yet; building the site without generated reports.'
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build Astro site
        working-directory: site
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build -- --base "$SITE_BASE_PATH"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
